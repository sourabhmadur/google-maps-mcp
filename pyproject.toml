[project]
name = "google-maps-mcp"
version = "0.1.0"
description = "MCP server exposing Google Maps Places, Geocoding, Directions, and current-location tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
google-maps-mcp = "google_maps_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_maps_mcp"]
